plugins { id 'com.android.application' }
android {
    namespace 'com.williamkwan.recruitpt'
    compileSdk 34
    defaultConfig {
        applicationId 'com.williamkwan.recruitpt'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { debug { debuggable true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
